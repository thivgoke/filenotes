<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ef">
  <title>Fieldnotes — a quieter way to learn</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f4ef; --white: #fffefa; --ink: #202a26; --muted: #788079;
      --line: #e6e5dc; --green: #245c48; --green-dark: #194733;
      --green-pale: #e8efe7; --orange: #d66b43; --shadow: 0 16px 46px rgba(34,48,39,.07);
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
      font-synthesis: none; text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--paper); color: var(--ink); }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 3px solid #a4c6a9; outline-offset: 3px; }
    a { color: inherit; }
    .shell { max-width: 1120px; margin: 0 auto; padding: 0 36px; }
    .topbar { height: 82px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .brand { display: inline-flex; gap: 11px; align-items: center; color: var(--ink); text-decoration: none; font-family: Georgia,serif; font-size: 22px; letter-spacing: -.7px; }
    .brand-mark { width: 31px; height: 31px; border-radius: 50%; display: grid; place-items: center; color: white; background: var(--green); font: 16px Georgia,serif; }
    .top-actions { display: flex; align-items: center; gap: 11px; }
    .user-chip { font-size: 13px; color: var(--muted); padding-right: 4px; }
    .button { border: 0; border-radius: 8px; padding: 11px 16px; background: var(--green); color: white; font-size: 13px; font-weight: 650; transition: background .16s,transform .16s; }
    .button:hover { background: var(--green-dark); transform: translateY(-1px); }
    .button.secondary { background: var(--white); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
    .button.secondary:hover { background: #f2f1e9; }
    .button.quiet { color: var(--muted); background: transparent; padding-left: 9px; padding-right: 9px; }
    .button.quiet:hover { color: var(--ink); background: #eae9e1; }
    .button.small { padding: 9px 12px; font-size: 12px; }
    .button:disabled { opacity: .46; cursor: not-allowed; transform: none; }
    main { min-height: calc(100vh - 156px); padding: 38px 0 64px; }
    .eyebrow { color: var(--green); text-transform: uppercase; letter-spacing: 1.7px; font-size: 10px; font-weight: 750; }
    h1,h2,h3,p { margin-top: 0; }
    h1,h2,h3 { font-family: Georgia,"Times New Roman",serif; font-weight: 500; letter-spacing: -.65px; }
    h1 { font-size: clamp(36px,5vw,55px); line-height: 1.07; }
    h2 { font-size: 30px; } h3 { font-size: 20px; }
    .muted { color: var(--muted); }
    .small-copy { color: var(--muted); font-size: 12px; line-height: 1.65; }
    .page-heading { display: flex; align-items: end; justify-content: space-between; gap: 22px; margin-bottom: 28px; }
    .page-heading h1 { margin: 9px 0 8px; font-size: clamp(34px,4vw,46px); }
    .page-heading p { margin-bottom: 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .card { background: var(--white); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 3px 14px rgba(34,48,39,.025); }
    .auth-wrap { display: grid; grid-template-columns: 1.05fr .95fr; max-width: 850px; margin: 42px auto; overflow: hidden; box-shadow: var(--shadow); }
    .auth-story { padding: 48px 45px; background: var(--green); color: white; position: relative; overflow: hidden; }
    .auth-story:after { content: "F"; position: absolute; right: -15px; bottom: -106px; font: 310px Georgia,serif; color: rgba(255,255,255,.07); }
    .auth-story .eyebrow { color: #b7d2b9; }
    .auth-story h1 { margin: 26px 0 18px; font-size: 42px; }
    .auth-story p { max-width: 290px; color: #d5e0d6; font-size: 14px; line-height: 1.8; }
    .auth-form { padding: 46px 42px; }
    .auth-form h2 { margin: 0 0 7px; font-size: 27px; }
    .auth-form > p { margin: 0 0 26px; font-size: 13px; color: var(--muted); }
    .field { display: block; margin-bottom: 16px; }
    .field span { display: block; margin-bottom: 7px; color: #4a544d; font-size: 12px; font-weight: 650; }
    .field input { width: 100%; padding: 12px 13px; border: 1px solid var(--line); border-radius: 7px; background: white; color: var(--ink); font-size: 14px; }
    .field input:focus { border-color: #7ba58a; outline: 3px solid #dfece0; }
    .auth-form .button { width: 100%; margin-top: 15px; }
    .auth-switch { margin-top: 18px !important; text-align: center; }
    .text-button { padding: 0; border: 0; background: none; color: var(--green); font-weight: 700; }
    .notice { padding: 12px 14px; border-radius: 8px; background: #f4f3ec; color: #62685f; font-size: 11px; line-height: 1.6; }
    .alert { padding: 12px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; line-height: 1.5; }
    .alert.error { background: #fff0ec; color: #9c3d27; } .alert.success { background: #edf4ed; color: var(--green-dark); }
    .hero { display: grid; grid-template-columns: 1.3fr .7fr; align-items: center; gap: 35px; padding: 36px 0 42px; }
    .hero h1 { max-width: 630px; margin: 14px 0; }
    .hero p { max-width: 550px; margin: 0; color: var(--muted); line-height: 1.7; font-size: 14px; }
    .hero-art { min-height: 182px; border-radius: 14px; background: #e8eee4; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
    .hero-art:before,.hero-art:after { content: ""; position: absolute; border: 1px solid rgba(36,92,72,.19); border-radius: 50%; }
    .hero-art:before { width: 175px; height: 175px; } .hero-art:after { width: 124px; height: 124px; }
    .art-book { z-index: 1; width: 94px; height: 122px; border-radius: 5px 10px 10px 5px; background: #fffefa; box-shadow: 8px 8px 0 #d9e3d5; transform: rotate(-6deg); padding: 23px 15px; }
    .art-book span { display: block; width: 100%; height: 4px; margin: 9px 0; border-radius: 5px; background: #c4d2c1; }
    .art-book span:first-child { width: 56%; background: var(--orange); }
    .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 13px; margin-bottom: 42px; }
    .stat { padding: 17px 19px; } .stat-label { font-size: 11px; color: var(--muted); }
    .stat-value { display: block; margin: 5px 0 1px; font: 27px Georgia,serif; }
    .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 15px; }
    .section-heading h2 { margin: 0; font-size: 25px; } .section-heading p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .topic-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; }
    .topic-card { min-height: 195px; padding: 20px; display: flex; flex-direction: column; cursor: pointer; transition: transform .18s,box-shadow .18s; }
    .topic-card:hover,.topic-card:focus-visible { transform: translateY(-3px); box-shadow: var(--shadow); }
    .topic-top { display: flex; align-items: center; justify-content: space-between; }
    .topic-icon { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px; color: var(--green); background: var(--green-pale); font: 17px Georgia,serif; }
    .tag { border-radius: 20px; padding: 5px 9px; background: var(--green-pale); color: var(--green); font-size: 10px; font-weight: 700; }
    .tag.pending { background: #f2f0e9; color: #858176; }
    .topic-card h3 { margin: 16px 0 5px; font-size: 19px; }
    .topic-card p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .topic-meta { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 19px; color: var(--muted); font-size: 11px; }
    .topic-meta strong { color: var(--green); font-size: 11px; }
    .empty-note { padding: 36px; text-align: center; color: var(--muted); font-size: 13px; }
    .recent-section { margin-top: 42px; } .session-list { overflow: hidden; }
    .session-row { display: grid; grid-template-columns: 1fr 1.1fr auto auto; align-items: center; gap: 20px; padding: 15px 19px; border-bottom: 1px solid var(--line); font-size: 12px; }
    .session-row:last-child { border-bottom: 0; } .session-row strong { font-size: 13px; } .score { color: var(--green); font-weight: 750; }
    .back-link { display: inline-block; margin-bottom: 18px; border: 0; padding: 0; color: var(--muted); background: none; font-size: 12px; }
    .back-link:hover { color: var(--green); }
    .topic-detail-head { display: flex; justify-content: space-between; align-items: start; gap: 20px; }
    .topic-detail-head h1 { margin: 8px 0; font-size: 43px; } .topic-detail-head p { color: var(--muted); font-size: 13px; }
    .detail-actions { display: flex; gap: 9px; flex-wrap: wrap; }
    .detail-grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 18px; margin-top: 24px; }
    .detail-panel { padding: 23px; } .detail-panel h2 { font-size: 22px; margin-bottom: 7px; }
    .detail-panel > p { color: var(--muted); font-size: 12px; line-height: 1.6; }
    .source-link { color: var(--green); font-size: 12px; text-decoration-thickness: 1px; text-underline-offset: 3px; word-break: break-word; }
    .session-history { margin-top: 13px; }
    .history-row { display: flex; justify-content: space-between; gap: 10px; padding: 11px 0; border-top: 1px solid var(--line); font-size: 12px; }
    .history-row span { color: var(--muted); } .empty-history { padding: 16px 0 0; color: var(--muted); font-size: 12px; }
    .quiz-shell { max-width: 760px; margin: 0 auto; }
    .quiz-top { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
    .quiz-title { font: 22px Georgia,serif; } .quiz-count { color: var(--muted); font-size: 12px; }
    .progress { height: 5px; margin: 13px 0 23px; overflow: hidden; border-radius: 5px; background: #e6e7de; }
    .progress span { display: block; height: 100%; background: var(--green); transition: width .2s; }
    .session-toolbar { position: sticky; top: 10px; z-index: 4; margin: 0 0 18px; padding: 14px 16px; }
    .session-toolbar-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .session-clock { color: var(--green); font: 700 14px/1.2 Consolas,monospace; font-variant-numeric: tabular-nums; }
    .session-progress-track { height: 5px; margin-top: 12px; overflow: hidden; border-radius: 6px; background: #e6e7de; }
    .session-progress-fill { height: 100%; width: 0; border-radius: inherit; background: var(--green); transition: width .2s; }
    .question-palette { display: grid; grid-template-columns: repeat(auto-fill,minmax(34px,1fr)); gap: 7px; margin-top: 14px; }
    .question-jump { height: 34px; border: 1px solid var(--line); border-radius: 7px; background: #f3f2ec; color: #62685f; font-size: 11px; font-weight: 700; }
    .question-jump:hover { border-color: #9bb9a0; }
    .question-jump.answered { background: var(--green-pale); border-color: #bfd2bd; color: var(--green-dark); }
    .question-jump.flagged { background: #fff1d4; border-color: #e4c274; color: #76520c; }
    .question-jump.current { box-shadow: 0 0 0 2px var(--green); }
    .session-hint { display: flex; flex-wrap: wrap; gap: 13px; margin-top: 12px; color: var(--muted); font-size: 10px; }
    .session-hint span { display: inline-flex; align-items: center; gap: 5px; }
    .hint-dot { width: 8px; height: 8px; border-radius: 50%; background: #e3e1d8; }
    .hint-dot.answered { background: #8eaf91; } .hint-dot.flagged { background: #e9bd57; }
    .draft-card { padding: 16px 18px; margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; gap: 15px; }
    .draft-actions { display: flex; gap: 8px; }
    .session-actions { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 18px; }
    .question-card { padding: clamp(22px,5vw,38px); }
    .question-number { color: var(--orange); font-size: 11px; text-transform: uppercase; letter-spacing: 1.4px; font-weight: 750; }
    .question-text { margin: 15px 0 25px; font: 26px/1.4 Georgia,serif; letter-spacing: -.3px; }
    .choices { display: grid; gap: 10px; }
    .choice { width: 100%; display: flex; align-items: center; gap: 13px; padding: 13px 15px; text-align: left; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; background: white; font-size: 13px; transition: border .15s,background .15s; }
    .choice:hover { border-color: #9bb9a0; } .choice.selected { border-color: var(--green); background: #f1f6f0; box-shadow: inset 0 0 0 1px var(--green); }
    .choice-letter { display: grid; place-items: center; flex: 0 0 25px; height: 25px; border: 1px solid var(--line); border-radius: 50%; color: var(--muted); font-size: 10px; }
    .choice.selected .choice-letter { color: white; border-color: var(--green); background: var(--green); }
    .quiz-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
    .quiz-footer .muted { font-size: 11px; }
    .result-hero { padding: 38px 28px; text-align: center; }
    .result-mark { width: 78px; height: 78px; display: grid; place-items: center; margin: 0 auto 17px; border-radius: 50%; background: var(--green-pale); color: var(--green); font: 29px Georgia,serif; }
    .result-hero h1 { margin: 0 0 10px; font-size: 38px; } .result-score { color: var(--green); font: 54px Georgia,serif; margin: 15px 0 4px; }
    .result-hero p { margin: 0; color: var(--muted); font-size: 13px; }
    .result-hero p.save-note { margin: 12px 0 0; }
    .result-hero p.save-error { color: #9c3d27; }
    .review { margin-top: 25px; } .review h2 { font-size: 25px; }
    .review-item { padding: 17px 19px; margin: 11px 0; }
    .review-item h3 { margin: 0 0 10px; font-size: 16px; line-height: 1.5; }
    .review-answer { font-size: 12px; line-height: 1.7; } .review-answer.correct { color: var(--green); } .review-answer.wrong { color: #b65037; }
    .explanation { color: var(--muted); } .result-actions { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }
    footer { border-top: 1px solid var(--line); padding: 18px 0 22px; color: #888b81; font-size: 10px; line-height: 1.7; }
    .footer-inner { display: flex; justify-content: space-between; gap: 25px; }
    .footer-inner span:last-child { text-align: right; }
    @media (max-width:760px) {
      .shell { padding: 0 21px; } .topbar { height: 70px; }
      .hero { grid-template-columns: 1fr; gap: 24px; padding: 34px 0; } .hero-art { min-height: 145px; }
      .topic-grid { grid-template-columns: repeat(2,1fr); } .auth-wrap { grid-template-columns: 1fr; margin: 10px auto; }
      .auth-story { padding: 30px; } .auth-story h1 { font-size: 34px; margin: 17px 0 10px; } .auth-story p { margin-bottom: 0; }
      .auth-form { padding: 31px 27px; } .detail-grid { grid-template-columns: 1fr; }
      .topic-detail-head { flex-direction: column; } .page-heading { align-items: start; flex-direction: column; }
      .session-row { grid-template-columns: 1fr auto; gap: 7px 15px; }
      .session-row>:nth-child(2) { grid-column: 1; } .session-row>:nth-child(3),.session-row>:nth-child(4) { grid-row: 1; }
      .session-row>:nth-child(4) { grid-column: 2; } .session-row>:nth-child(3) { display: none; }
    }
    @media (max-width:480px) {
      .shell { padding: 0 16px; } .brand { font-size: 19px; } .top-actions { gap: 4px; }
      .user-chip { display: none; } .button.small { padding: 8px 9px; }
      .stats { gap: 8px; } .stat { padding: 13px 11px; } .stat-label { font-size: 9px; } .stat-value { font-size: 23px; }
      .topic-grid { grid-template-columns: 1fr; } .topic-card { min-height: 175px; }
      .section-heading { align-items: start; flex-direction: column; }
      .footer-inner { flex-direction: column; gap: 5px; } .footer-inner span:last-child { text-align: left; }
      .quiz-top { align-items: start; } .question-text { font-size: 22px; }
      .result-actions { flex-direction: column; } .detail-actions { width: 100%; }
      .draft-card { align-items: start; flex-direction: column; }
      .session-toolbar { top: 5px; padding: 11px; }
      .session-actions { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#" id="brand-home" aria-label="Fieldnotes home"><span class="brand-mark">f.</span> fieldnotes</a>
      <div class="top-actions" id="top-actions"></div>
    </header>
    <main id="app" aria-live="polite"></main>
    <footer><div class="footer-inner">
      <span>Fieldnotes · Your study space, kept simple.</span>
      <span>Local demo: account records and completed sessions stay on this computer.</span>
    </div></footer>
  </div>
  <script>
    "use strict";
    const STORAGE_KEY = "fieldnotes.quiz.v1";
    const NOTEBOOKS = [
      { title: "Notebook 01", sourceUrl: "https://notebook.google.com/notebook/88f5339c-bb91-4dd4-91fb-06df899492b5", fileName: "french-culinary-hospitality.json" },
      { title: "Notebook 02", sourceUrl: "https://notebook.google.com/notebook/40dcdcaf-6234-4653-b4ae-ea989f67f5a8", fileName: "jrf-notes.json" },
      { title: "Notebook 03", sourceUrl: "https://notebook.google.com/notebook/79612cbf-64b1-430b-9c56-26e9aee34c90", fileName: "paper-1-classes.json" },
      { title: "Notebook 04", sourceUrl: "https://notebook.google.com/notebook/8fa9e405-e15d-4082-8f8a-b835354687eb", fileName: "youtube-jrf-classes.json" },
      { title: "Notebook 05", sourceUrl: "https://notebook.google.com/notebook/16290978-36e8-448e-a73b-df691a1031a8", fileName: "home-science-pyq.json" }
    ];
    const app = document.getElementById("app");
    const topActions = document.getElementById("top-actions");
    let data = loadData();
    let screen = "auth";
    let authMode = "login";
    let message = "";
    let messageType = "error";
    let selectedTopicId = null;
    let activeQuiz = null;
    let latestResultId = null;
    let quizTimerInterval = null;
    let resultSaveError = "";
    let finishingQuiz = false;

    function makeId() {
      return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() :
        "id-" + Date.now().toString(36) + Math.random().toString(36).slice(2);
    }
    function formatDuration(seconds) {
      const total = Math.max(0, Math.floor(Number(seconds) || 0));
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const remaining = total % 60;
      return hours
        ? `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}:${String(remaining).padStart(2, "0")}`
        : `${String(minutes).padStart(2, "0")}:${String(remaining).padStart(2, "0")}`;
    }
    function elapsedSeconds(startedAt) {
      const start = Number(startedAt);
      return Number.isFinite(start) ? Math.max(0, Math.floor((Date.now() - start) / 1000)) : 0;
    }
    function seedData(base) {
      base.topics = NOTEBOOKS.map((notebook, index) => ({
        id: "notebook-" + (index + 1), title: notebook.title, sourceUrl: notebook.sourceUrl,
        questionBankFileName: notebook.fileName, questions: []
      }));
      return base;
    }
    function loadData() {
      const empty = { users: [], topics: [], results: [], drafts: [], currentUserId: null };
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        const parsed = saved ? JSON.parse(saved) : null;
        if (!parsed) return seedData(empty);
        if (!Array.isArray(parsed.users) || !Array.isArray(parsed.topics) || !Array.isArray(parsed.results)) {
          throw new Error("Stored quiz data has an unexpected format.");
        }
        const topics = [...parsed.topics];
        NOTEBOOKS.forEach((notebook, index) => {
          const existing = topics.find(topic => topic.sourceUrl === notebook.sourceUrl);
          if (existing) existing.questionBankFileName = existing.questionBankFileName || notebook.fileName;
          else topics.push({
            id: "notebook-" + (index + 1), title: notebook.title, sourceUrl: notebook.sourceUrl,
            questionBankFileName: notebook.fileName, questions: []
          });
        });
        return {
          users: parsed.users,
          topics,
          results: parsed.results,
          drafts: Array.isArray(parsed.drafts) ? parsed.drafts : [],
          currentUserId: parsed.currentUserId || null
        };
      } catch (error) {
        console.error("Could not load saved quiz data:", error);
        return seedData(empty);
      }
    }
    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (error) {
        console.error("Could not save quiz data:", error);
        throw new Error("Your browser could not save this change. Check available storage space and browser settings.");
      }
    }
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[char]);
    }
    function safeSourceUrl(value) {
      try {
        const url = new URL(String(value));
        return url.protocol === "https:" ? url.href : "";
      } catch {
        return "";
      }
    }
    function currentUser() { return data.users.find(user => user.id === data.currentUserId) || null; }
    function userResults() {
      const user = currentUser();
      return user ? data.results.filter(result => result.userId === user.id) : [];
    }
    function userDraft() {
      const user = currentUser();
      return user ? data.drafts.find(draft => draft.userId === user.id) || null : null;
    }
    function clearMessage() { message = ""; messageType = "error"; }
    function showMessage(text, type = "error") { message = text; messageType = type; render(); }
    function renderHeader() {
      const user = currentUser();
      topActions.innerHTML = user
        ? `<span class="user-chip">Hello, ${escapeHtml(user.username)}</span>
           <button class="button quiet small" id="logout">Sign out</button>` : "";
      const logoutButton = document.getElementById("logout");
      if (logoutButton) logoutButton.addEventListener("click", logout);
    }
    function render() {
      renderHeader();
      if (!currentUser()) { screen = "auth"; renderAuth(); }
      else if (screen === "topic") renderTopic();
      else if (screen === "quiz") renderQuiz();
      else if (screen === "result") renderResult();
      else { screen = "dashboard"; renderDashboard(); }
      document.getElementById("brand-home").onclick = event => {
        event.preventDefault();
        if (currentUser()) { screen = "dashboard"; clearMessage(); render(); }
      };
    }
    function renderAuth() {
      const register = authMode === "register";

          method: "POST",

          body: JSON.stringify({ username, password })
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || `Server returned HTTP ${response.status}.`);
        if (!payload.user || typeof payload.user.id !== "string" || typeof payload.user.username !== "string") {
          throw new Error("The local server returned an invalid account record.");
        }
        const user = payload.user;
        const previousUser = data.users.find(item => item.username.toLowerCase() === user.username.toLowerCase());

          data.results.forEach(result => { if (result.userId === previousUser.id) result.userId = user.id; });
          data.drafts.forEach(draft => { if (draft.userId === previousUser.id) draft.userId = user.id; });
        }
        data.users = data.users.filter(item => item.id !== user.id && item.username.toLowerCase() !== user.username.toLowerCase());
        data.users.push({ id: user.id, username: user.username });
        data.currentUserId = user.id;

        console.error("Sign-in failed:", error);
        showMessage(error.message || "We couldn't complete sign-in. Please try again.");

    function validateQuestionBank(json) {
      const inputTopics = Array.isArray(json) ? json : Array.isArray(json.topics) ? json.topics : [json];
      if (!inputTopics.length) throw new Error("No topics were found in this file.");
      return inputTopics.map((topic, topicIndex) => {
        if (!topic || typeof topic.title !== "string" || !topic.title.trim()) throw new Error(`Topic ${topicIndex + 1} needs a title.`);
        if (!Array.isArray(topic.questions) || !topic.questions.length) throw new Error(`“${topic.title}” needs at least one question.`);
        const questions = topic.questions.map((question, questionIndex) => {
          if (!question || typeof question.question !== "string" || !question.question.trim()) {
            throw new Error(`Question ${questionIndex + 1} in “${topic.title}” needs question text.`);
          }
          if (!Array.isArray(question.choices) || question.choices.length < 2 || question.choices.length > 6 ||
              question.choices.some(choice => typeof choice !== "string" || !choice.trim())) {
            throw new Error(`Question ${questionIndex + 1} in “${topic.title}” needs 2–6 non-empty choices.`);
          }
          const answerIndex = Number(question.answerIndex);
          if (!Number.isInteger(answerIndex) || answerIndex < 0 || answerIndex >= question.choices.length) {
            throw new Error(`Question ${questionIndex + 1} in “${topic.title}” needs a valid zero-based answerIndex.`);
          }
          return { question: question.question.trim(), choices: question.choices.map(choice => choice.trim()), answerIndex,
            explanation: typeof question.explanation === "string" ? question.explanation.trim() : "" };
        });
        return { title: topic.title.trim(), sourceUrl: typeof topic.sourceUrl === "string" ? topic.sourceUrl.trim() : "", questions };
      });
    }
    async function loadQuestionBanks() {

        if (!response.ok) throw new Error(payload.error || `Server returned HTTP ${response.status}.`);
        if (!payload || !Array.isArray(payload.banks)) throw new Error("The server returned an invalid question-bank list.");

        const banks = payload.banks.flatMap(item => {
          if (!item || typeof item.fileName !== "string") throw new Error("A question bank is missing its filename.");
          return validateQuestionBank(item.bank).map(bank => ({ ...bank, questionBankFileName: item.fileName }));
        });
        banks.forEach(bank => {
          const notebook = NOTEBOOKS.find(item => item.fileName === bank.questionBankFileName);
          const existing = data.topics.find(topic =>
            (bank.sourceUrl && topic.sourceUrl === bank.sourceUrl) ||
            topic.questionBankFileName === bank.questionBankFileName ||
            topic.title.toLowerCase() === bank.title.toLowerCase()
          );
          if (existing) {
            existing.title = bank.title;
            existing.sourceUrl = bank.sourceUrl || existing.sourceUrl;
            existing.questionBankFileName = bank.questionBankFileName;
            existing.questions = bank.questions;
          } else {
            data.topics.push({
              id: makeId(),
              title: bank.title,
              sourceUrl: bank.sourceUrl || (notebook ? notebook.sourceUrl : ""),
              questionBankFileName: bank.questionBankFileName,
              questions: bank.questions
            });
          }
        });
        saveData();
        if (currentUser() && screen !== "quiz" && screen !== "result") render();
        await syncPendingAttempts();
      } catch (error) {
        console.error("Could not load question banks from the local server:", error);
        message = location.protocol === "file:"
          ? "Start the local server with “npm start”, then open http://127.0.0.1:4173 to load topics and save sessions."
          : `Could not load question banks from the local server: ${error.message}`;
        messageType = "error";
        render();
      }
    }
    async function saveAttemptToServer(result) {
      const topic = data.topics.find(item => item.id === result.topicId);
      const topicFileName = result.questionBankFileName || (topic && topic.questionBankFileName);
      if (!topicFileName) throw new Error("This topic has no question-bank filename configured.");
      const response = await fetch("/api/session-attempts", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ topicFileName, attempt: result })
      });
      const payload = await response.json();
      if (!response.ok || !payload.saved || typeof payload.fileName !== "string") {
        throw new Error(payload.error || `Server returned HTTP ${response.status}.`);
      }
      result.questionBankFileName = topicFileName;
      result.sessionFileName = payload.fileName;
      return payload.fileName;
    }
    async function syncPendingAttempts() {
      const pending = data.results.filter(result => !result.serverSavedAt);
      const errors = [];
      for (const result of pending) {
        try {
          const fileName = await saveAttemptToServer(result);
          result.serverSavedAt = Date.now();
          result.sessionFileName = fileName;
          saveData();
        } catch (error) {
          console.error(`Could not sync session ${result.id}:`, error);
          errors.push(error.message);
        }
      }
      if (errors.length) {
        message = `Some sessions could not be saved to their topic JSON files. They will retry on the next launch. ${errors[0]}`;
        messageType = "error";
        if (screen !== "quiz" && screen !== "result") render();
      }
    }
    render();
    loadQuestionBanks();
  </script>
</body>
</html>
